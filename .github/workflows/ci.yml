name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian:
    name: Debian 13
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 20

    steps:
      - name: Install build dependencies
        shell: sh
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            file \
            librsvg2-bin \
            ninja-build \
            pkgconf \
            libgtk-4-dev \
            xvfb \
            xauth \
            dbus

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GTK application
        run: |
          cmake -S . -B build-ci-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror" \
            -DSCRABBLE_BUILD_GUI=ON \
            -DSCRABBLE_BUILD_DEBIAN_PACKAGE=ON \
            -DBUILD_TESTING=ON

      - name: Build GTK application
        run: cmake --build build-ci-gui

      - name: Test GTK application and core
        run: xvfb-run -a ctest --test-dir build-ci-gui --output-on-failure

      - name: Verify install layout
        run: |
          cmake --install build-ci-gui --prefix "$PWD/stage"
          test -x stage/bin/scrabble_solver
          test -f stage/share/applications/com.jojokorok.scrabblesolver.desktop
          test -f stage/share/icons/hicolor/scalable/apps/com.jojokorok.scrabblesolver.svg
          test -f stage/share/scrabble-solver/dictionaries/enable2k.txt
          test -f stage/share/scrabble-solver/dictionaries/README.md
          test -f stage/share/scrabble-solver/styles/application.css
          test -f stage/share/doc/scrabble-solver/copyright

      - name: Package Debian application
        run: cmake --build build-ci-gui --target package

      - name: Verify Debian package
        run: |
          set -eu
          package="$(find build-ci-gui -maxdepth 1 -type f \
            -name 'scrabble-solver_*_amd64.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb --field "$package" Package)" = "scrabble-solver"
          test "$(dpkg-deb --field "$package" Architecture)" = "amd64"
          dpkg-deb --field "$package" Depends | grep -q 'libgtk-4-1'
          mkdir package-check
          dpkg-deb --extract "$package" package-check
          test -x package-check/usr/bin/scrabble_solver
          test -f package-check/usr/share/scrabble-solver/dictionaries/enable2k.txt
          test -f package-check/usr/share/scrabble-solver/styles/application.css
          test -f package-check/usr/share/doc/scrabble-solver/copyright
          desktop-file-validate \
            package-check/usr/share/applications/com.jojokorok.scrabblesolver.desktop
          rsvg-convert \
            package-check/usr/share/icons/hicolor/scalable/apps/com.jojokorok.scrabblesolver.svg \
            --output package-check/icon-check.png

      - name: Configure core-only build
        run: |
          cmake -S . -B build-ci-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror" \
            -DSCRABBLE_BUILD_GUI=OFF \
            -DBUILD_TESTING=ON

      - name: Build and test core-only configuration
        run: |
          cmake --build build-ci-core
          ctest --test-dir build-ci-core --output-on-failure

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrabble-solver-debian-amd64-${{ github.sha }}
          path: build-ci-gui/scrabble-solver_*_amd64.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows UCRT64
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4

      - name: Configure GTK application
        run: |
          cmake -S . -B build-ci-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror" \
            -DSCRABBLE_BUILD_GUI=ON \
            -DSCRABBLE_BUNDLE_WINDOWS_RUNTIME=ON \
            -DBUILD_TESTING=ON

      - name: Build GTK application
        run: cmake --build build-ci-gui

      - name: Test GTK application and core
        run: ctest --test-dir build-ci-gui --output-on-failure

      - name: Verify install layout
        run: |
          cmake --install build-ci-gui --prefix "$PWD/stage"
          test -f stage/LICENSE
          test -f stage/bin/scrabble_solver.exe
          test -f stage/bin/libgtk-4-1.dll
          test -f stage/share/scrabble-solver/dictionaries/enable2k.txt
          test -f stage/share/scrabble-solver/dictionaries/README.md
          test -f stage/share/scrabble-solver/styles/application.css
          test -f stage/share/glib-2.0/schemas/gschemas.compiled
          test -d stage/share/icons/Adwaita
          test -f stage/share/licenses/gtk4/COPYING

      - name: Package portable Windows application
        run: cmake --build build-ci-gui --target package

      - name: Verify portable Windows archive
        run: |
          archive="$(find build-ci-gui -maxdepth 1 -type f \
            -name 'scrabble-solver-*-windows-x86_64.zip' -print -quit)"
          test -n "$archive"
          mkdir package-check
          cmake -E chdir package-check cmake -E tar xf "../$archive"
          package_root="$(find package-check -mindepth 1 -maxdepth 1 \
            -type d -print -quit)"
          test -n "$package_root"
          test -f "$package_root/LICENSE"
          test -f "$package_root/bin/scrabble_solver.exe"
          test -f "$package_root/bin/libgtk-4-1.dll"
          test -f "$package_root/share/scrabble-solver/dictionaries/enable2k.txt"
          test -f "$package_root/share/glib-2.0/schemas/gschemas.compiled"
          test -f "$package_root/share/licenses/gtk4/COPYING"

      - name: Configure core-only build
        run: |
          cmake -S . -B build-ci-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror" \
            -DSCRABBLE_BUILD_GUI=OFF \
            -DBUILD_TESTING=ON

      - name: Build and test core-only configuration
        run: |
          cmake --build build-ci-core
          ctest --test-dir build-ci-core --output-on-failure

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrabble-solver-windows-x86_64-${{ github.sha }}
          path: build-ci-gui/scrabble-solver-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
